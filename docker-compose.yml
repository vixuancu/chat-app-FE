version: "3.8"

services:
  chat-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-app-frontend:latest
    container_name: chat-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  chat-network:
    driver: bridge
